plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.sudokulive'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.sudokulive'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled/offline Latin text recognizer. Digits 1-9 are handled locally after install.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
